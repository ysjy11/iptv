name: Generate playlist manually

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 → 北京时间 06:00
    - cron: '0 10 * * *'  # UTC 10:00 → 北京时间 18:00

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pages_base_url: ${{ steps.gen.outputs.pages_base_url }}
      release_tag: ${{ steps.gen.outputs.release_tag }}
      release_title: ${{ steps.gen.outputs.release_title }}
      source_sha: ${{ steps.gen.outputs.source_sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate playlist
        id: gen
        run: |
          python service/main.py
          cat output/summary.txt
          echo "pages_base_url=${{ github.server_url }}/${{ github.repository_owner }}/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          echo "release_tag=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          echo "release_title=Auto generated playlist $(date +%Y-%m-%d %H:%M)" >> $GITHUB_OUTPUT
          echo "source_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy-pages:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
